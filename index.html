<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пончики — Ростов-на-Дону</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--or:#E8922A;--gold:#E8A94B;--brown:#4b2412;--mut:rgba(75,36,18,.6);--dim:#9a6d3c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;font-family:'Manrope',system-ui,sans-serif;color:#fff;overflow:hidden}
body{display:flex;justify-content:center}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
h1,h2,h3,.bl{font-family:'Baloo 2','Manrope',sans-serif}
#app{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;background:linear-gradient(180deg,#2c1a12 0%,#0c0a0b 55%,#05070b 100%)}
.screen{position:absolute;inset:0}
/* welcome */
#welcome{z-index:20;display:flex;flex-direction:column;background:linear-gradient(180deg,#2a1912,#05070b 70%);transition:opacity .7s ease,transform .7s cubic-bezier(.7,0,.3,1)}
#welcome.out{opacity:0;transform:scale(1.06);pointer-events:none}
.hero{margin:44px auto 0;width:79%;flex:1;min-height:0;max-height:560px;border-radius:30px;overflow:hidden;animation:pop 1s cubic-bezier(.2,.8,.2,1) both}
.hero img{width:100%;height:100%;object-fit:cover;animation:kb 12s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.12)}}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.94)}}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
.wt{text-align:center;margin-top:26px;animation:up .8s .25s both}
.wt h2{color:var(--gold);font-size:19px;font-weight:700}
.wt p{color:#8a6a45;font-size:13px;margin-top:8px;padding:0 22px}
.dash{display:flex;gap:6px;justify-content:center;margin:36px 0 34px}
.dash i{height:4px;width:12px;border-radius:3px;background:#3a3026;overflow:hidden;position:relative}
.dash i:first-child{width:50px}
.dash i:first-child::after{content:"";position:absolute;inset:0;background:var(--or);transform-origin:left;animation:fill 3.4s ease-in-out infinite}
@keyframes fill{from{transform:scaleX(0)}70%,to{transform:scaleX(1)}}
.btn{display:block;margin:0 auto;border-radius:6px;font-weight:700;transition:transform .2s,filter .2s}
.btn:active{transform:scale(.96)}
.b1{width:85%;height:60px;background:var(--or);color:var(--brown);font-size:17px;animation:up .8s .45s both}
.b2{width:150px;height:60px;margin-top:4px;margin-bottom:30px;background:#7a4d17;color:#a9855b;font-size:14px;font-weight:500;animation:up .8s .6s both}
.b1:hover{filter:brightness(1.08)}
/* main */
#main .sc{position:absolute;inset:0;overflow-y:auto;padding:12px 0 110px;scrollbar-width:none}
#main .sc::-webkit-scrollbar{display:none}
.loc{display:flex;align-items:center;gap:6px;padding:0 0 0 32px;font-size:14px;font-weight:600}
.pad{padding:0 11% 0 12.4%}
.ban{position:relative;margin-top:14px;height:180px;border-radius:24px;overflow:hidden;background:linear-gradient(100deg,#6b4129,#8b5b3c 55%,#6d442b);animation:up .8s both}
.ban img{position:absolute;right:0;top:0;height:100%;width:62%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%);animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.07) translateX(-4px)}}
.ban h3{position:relative;color:#c4954f;font-size:27px;line-height:1.1;font-weight:800;padding:60px 0 0 16px;width:70%}
.cats{display:flex;justify-content:space-between;margin:52px 0 30px;padding:0 9% 0 10%}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;color:#b7792a;font-size:11px;opacity:.9;transition:transform .25s,color .25s}
.cat svg{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.cat:hover svg{transform:translateY(-3px) rotate(-8deg)}
.cat.on{color:var(--gold);opacity:1}
.cat.on svg{transform:scale(1.2)}
.cat.on span{border-bottom:1.5px solid var(--gold)}
h1{color:var(--gold);font-size:32px;font-weight:700;padding-left:12%;margin-bottom:10px;line-height:1.3}
.sb{height:0;overflow:hidden;transition:height .4s cubic-bezier(.2,.8,.2,1)}
.sb.open{height:56px}
.sb input{width:100%;height:42px;margin-top:6px;border-radius:10px;border:1.5px solid #6a4620;background:#150f0b;color:#fff;padding:0 14px;font:inherit;outline:0}
.sb input:focus{border-color:var(--or)}
.card{position:relative;display:flex;gap:11px;background:var(--or);border-radius:10px;padding:10px;margin-bottom:20px;color:var(--brown);cursor:pointer;animation:up .6s both cubic-bezier(.2,.8,.2,1);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(232,146,42,.25)}
.card:active{transform:scale(.97)}
.th{flex:none;width:78px;height:78px;border-radius:8px;background:#fff;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.ci{flex:1;min-width:0;display:flex;flex-direction:column}
.ci h3{font-size:18px;font-weight:800;line-height:1.1;padding-right:26px}
.ci p{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.3}
.cf{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;font-weight:700;font-size:13px}
.cf b{font-size:15px;font-weight:600}
.heart{position:absolute;top:8px;right:9px;color:var(--brown);display:grid;place-items:center}
.heart.on{animation:beat .45s}
.heart.on svg{color:#b3261e}
@keyframes beat{40%{transform:scale(1.5)}}
.none{text-align:center;color:#8a6a45;padding:30px 0}
/* tabbar */
.tabs{position:absolute;left:0;right:0;bottom:0;height:calc(72px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:#05070b;display:flex;justify-content:center;gap:44px;align-items:center;z-index:10}
.tabs button{position:relative;color:#d7b68a;padding:10px;transition:transform .25s,color .25s}
.tabs button.on{color:var(--gold)}
.tabs button:active{transform:scale(.85)}
.badge{position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:9px;background:var(--or);color:var(--brown);font-size:11px;font-weight:800;display:grid;place-items:center;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.badge.show{transform:scale(1)}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35) rotate(-8deg)}}
/* sheets */
.sheet{position:absolute;inset:0;z-index:30;pointer-events:none}
.sheet.open{pointer-events:auto}
.back{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .4s;backdrop-filter:blur(3px)}
.sheet.open .back{opacity:1}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;border-radius:30px 30px 0 0;background:linear-gradient(180deg,#3a2316,#150e0a);padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .55s cubic-bezier(.2,.9,.25,1)}
.sheet.open .panel{transform:none}
.x{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;z-index:2;transition:transform .3s}
.x:hover{transform:rotate(90deg)}
.dimg{width:190px;height:190px;margin:14px auto 18px;border-radius:28px;background:#fff;overflow:hidden;box-shadow:0 16px 40px rgba(232,146,42,.3);transform:scale(.7) rotate(-6deg);opacity:0;transition:.7s .15s cubic-bezier(.2,1.2,.3,1)}
.sheet.open .dimg{transform:none;opacity:1}
.dimg img{width:100%;height:100%;object-fit:cover}
.dh{display:flex;justify-content:space-between;align-items:center}
.dh h2{color:var(--gold);font-size:30px;font-weight:700}
.dh .heart{position:static;color:var(--gold)}
.meta{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 10px;color:#c9a572;font-size:14px}
.meta b{color:var(--or);font-size:22px;font-weight:800;font-family:'Baloo 2'}
.panel>p{color:#cdb79a;font-size:14px;line-height:1.55}
.dbuy{display:flex;gap:12px;margin-top:22px;align-items:center}
.qty{display:flex;align-items:center;gap:6px;background:rgba(232,146,42,.14);border-radius:10px;padding:4px}
.qty button{width:34px;height:34px;border-radius:8px;background:var(--or);color:var(--brown);font-size:20px;font-weight:800;line-height:1;transition:transform .15s}
.qty button:active{transform:scale(.85)}
.qty i{min-width:24px;text-align:center;font-style:normal;font-weight:700}
.go{flex:1;height:50px;border-radius:10px;background:var(--or);color:var(--brown);font-weight:800;font-size:15px;transition:transform .2s,filter .2s}
.go:active{transform:scale(.96)}
.panel h2.ct{color:var(--gold);font-size:28px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);animation:up .5s both}
.row .th{width:56px;height:56px}
.ri{flex:1;min-width:0}
.ri b{display:block;font-family:'Baloo 2';font-size:16px;color:var(--gold)}
.ri span{font-size:13px;color:#c9a572}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 14px;font-size:15px;color:#cdb79a}
.tot b{font-family:'Baloo 2';font-size:26px;color:#fff}
.empty{text-align:center;padding:30px 0;color:#8a6a45}
.empty p{color:#cdb79a;font-weight:700;margin-top:12px}
.ok{text-align:center;padding:24px 0}
.ok svg{width:90px;height:90px;color:var(--or)}
.ok circle,.ok path{stroke-dasharray:80;stroke-dashoffset:80;animation:draw .9s .1s forwards}
.ok path{animation-delay:.6s}
@keyframes draw{to{stroke-dashoffset:0}}
.ok h2{color:var(--gold);margin-top:10px}
.ok p{color:#cdb79a;margin-top:6px}
.fly{position:fixed;width:60px;height:60px;border-radius:14px;object-fit:cover;z-index:100;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,20px);background:#fff;color:var(--brown);font-weight:700;font-size:13px;padding:10px 18px;border-radius:20px;opacity:0;z-index:60;transition:.4s cubic-bezier(.2,.9,.3,1);white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

{id:7,c:'dr',n:'Какао',d:'Густой горячий какао на молоке с зефиром.',l:'Согреет в любую погоду.',w:'250 мл',p:150,i:cup},
{id:8,c:'dr',n:'Капучино',d:'Классический капучино на свежесваренном эспрессо.',l:'Отлично сочетается с глазурными пончиками.',w:'250 мл',p:170,i:cup}];
const cats=[['cl','Классика'],['fl','С начинкой'],['st','Сеты'],['dr','Напитки']];
const names={cl:'Классика',fl:'С начинкой',st:'Сеты',dr:'Напитки'};
let cat=null,q='',cart={},favs=new Set(),cur=null,dq=1,tt;
const find=id=>items.find(x=>x.id==id);
$('#loc').innerHTML=svg('pin',26)+'<span>Ростов-на-Дону</span>';
$('#cats').innerHTML=cats.map(([k,t])=>`<button class="cat" data-cat="${k}">${svg(k,26)}<span>${t}</span></button>`).join('');
$('#tabs').innerHTML=`<button class="on" data-t="home">${svg('home',27)}</button><button data-t="search">${svg('search',27)}</button><button data-t="user">${svg('user',27)}</button><button id="tcart" data-t="cart">${svg('cart',27)}<span class="badge" id="bd">0</span></button>`;
$('#cartS .x').innerHTML=svg('x',18);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1900)}
function list(){
  const a=items.filter(x=>(!cat||x.c==cat)&&x.n.toLowerCase().includes(q.toLowerCase()));
  $('#ttl').textContent=cat?names[cat]:'Все пончики';
  $('#list').innerHTML=a.length?a.map((x,i)=>`<div class="card" data-id="${x.id}" style="animation-delay:${i*.08}s"><div class="th"><img src="${x.i}" alt=""></div><div class="ci"><h3>${x.n}</h3><p>${x.d}</p><div class="cf"><span>${x.w}</span><b>${x.p} руб</b></div></div><button class="heart ${favs.has(x.id)?'on':''}" data-fav="${x.id}">${svg('heart',22,favs.has(x.id)?'currentColor':'none')}</button></div>`).join(''):'<div class="none">Ничего не найдено</div>';
}
function count(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function badge(){const n=count(),b=$('#bd');b.textContent=n;b.classList.toggle('show',n>0)}
function open(id){$(id).classList.add('open')}
function close(){document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'))}
function detail(id){
  cur=find(id);dq=1;
  $('#dBody').innerHTML=`<button class="x" data-close>${svg('x',18)}</button><div class="dimg"><img src="${cur.i}" alt=""></div><div class="dh"><h2>${cur.n}</h2><button class="heart ${favs.has(cur.id)?'on':''}" data-fav="${cur.id}">${svg('heart',26,favs.has(cur.id)?'currentColor':'none')}</button></div><div class="meta"><span>${cur.w}</span><b>${cur.p} руб</b></div><p>${cur.d} ${cur.l}</p><div class="dbuy"><div class="qty"><button data-a="dm">−</button><i id="dq">1</i><button data-a="dp">+</button></div><button class="go" id="add">В корзину · <span id="dt">${cur.p}</span> руб</button></div>`;
  open('#detail');
}
function fly(from,img){
  const a=from.getBoundingClientRect(),b=$('#tcart').getBoundingClientRect();
  const e=document.createElement('img');e.src=img;e.className='fly';
  e.style.left=a.left+a.width/2-30+'px';e.style.top=a.top-30+'px';document.body.append(e);
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-a.top;
  e.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx*.5}px,${dy*.6-60}px) scale(.8)`,opacity:1,offset:.4},{transform:`translate(${dx}px,${dy}px) scale(.15)`,opacity:.2}],{duration:800,easing:'cubic-bezier(.5,0,.8,.5)'}).onfinish=()=>{e.remove();const t=$('#tcart');t.classList.remove('bump');void t.offsetWidth;t.classList.add('bump')};
}
function add(id,n){cart[id]=(cart[id]||0)+n;badge()}
function cartView(){
  const ids=Object.keys(cart),b=$('#cartBody'),f=$('#cartFoot');
  if(!ids.length){b.innerHTML=`<div class="empty">${svg('cart',46)}<p>Корзина пока пуста</p><small>Добавьте что-нибудь вкусное</small></div>`;f.innerHTML='';return}
  b.innerHTML=ids.map((id,i)=>{const x=find(id);return `<div class="row" style="animation-delay:${i*.06}s"><div class="th"><img src="${x.i}" alt=""></div><div class="ri"><b>${x.n}</b><span>${x.p*cart[id]} руб</span></div><div class="qty"><button data-a="m" data-id="${id}">−</button><i>${cart[id]}</i><button data-a="p" data-id="${id}">+</button></div></div>`}).join('');
  const t=ids.reduce((s,id)=>s+find(id).p*cart[id],0);
  f.innerHTML=`<div class="tot"><span>Итого</span><b>${t} руб</b></div><button class="go" style="width:100%" data-a="order">Оформить заказ</button>`;
}
function enter(){$('#welcome').classList.add('out');list()}
$('#enter').onclick=enter;$('#skip').onclick=enter;
$('#q').oninput=e=>{q=e.target.value;list()};
document.addEventListener('click',e=>{
  const t=e.target;
  const fav=t.closest('[data-fav]');
  if(fav){e.stopPropagation();const id=+fav.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);list();if($('#detail').classList.contains('open')&&cur&&cur.id==id){const h=$('#dBody .heart');h.classList.toggle('on',favs.has(id));h.innerHTML=svg('heart',26,favs.has(id)?'currentColor':'none')}return}
  if(t.closest('[data-close]')&&(t.closest('.x')||t.classList.contains('back'))){close();return}
  const c=t.closest('[data-cat]');
  if(c){cat=cat==c.dataset.cat?null:c.dataset.cat;document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('on',b.dataset.cat==cat));list();return}
  const card=t.closest('.card');if(card){detail(card.dataset.id);return}
  const tb=t.closest('[data-t]');
  if(tb){const k=tb.dataset.t;
    if(k=='cart'){cartView();open('#cartS')}
    else if(k=='home'){q='';$('#q').value='';cat=null;document.querySelectorAll('.cat').forEach(b=>b.classList.remove('on'));$('#sb').classList.remove('open');list();$('#sc').scrollTo({top:0,behavior:'smooth'})}
    else if(k=='search'){const s=$('#sb');s.classList.toggle('open');$('#sc').scrollTo({top:300,behavior:'smooth'});if(s.classList.contains('open'))setTimeout(()=>$('#q').focus({preventScroll:true}),350)}
    else toast('Личный кабинет скоро появится');
    return}
  const a=t.closest('[data-a],#add');if(!a)return;
  const act=a.id=='add'?'add':a.dataset.a,id=a.dataset.id;
  if(act=='dp'||act=='dm'){dq=Math.max(1,dq+(act=='dp'?1:-1));$('#dq').textContent=dq;$('#dt').textContent=dq*cur.p}
  else if(act=='add'){fly($('#dBody .dimg'),cur.i);add(cur.id,dq);toast(`${cur.n} добавлен в корзину`);setTimeout(close,250)}
  else if(act=='p'||act=='m'){cart[id]+=act=='p'?1:-1;if(cart[id]<1)delete cart[id];badge();cartView()}
  else if(act=='order'){cart={};badge();$('#cartBody').innerHTML=`<div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ic.ok}</svg><h2>Заказ принят!</h2><p>Сладкое счастье уже в пути</p></div>`;$('#cartFoot').innerHTML='';}
});
list();
</script>
